[build-system]
requires = []
build-backend = "packaging_backend"
backend-path = ["."]

[project]
name = "coi-fraud"
version = "0.1.0"
description = "Fraud detection experimentation utilities for the COI project"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  {name = "COI Team"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "pandas>=1.3",
  "numpy>=1.21",
  "seaborn>=0.11",
  "scikit-learn>=1.0",
  "scipy>=1.7",
]

[tool.setuptools.packages.find]
include = ["coi_fraud", "coi_fraud.*"]
